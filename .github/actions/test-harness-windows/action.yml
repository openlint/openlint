name: test-harness
description: 'Run tests.'
inputs:
  os:
    description: 'Operating system to run the tests on (linux, windows, macos)'
    required: true
  node-version:
    description: 'Node.js version to run the tests with'
    required: true
runs:
  using: composite
  steps:
  - uses: "./.github/actions/build-binary"
    with:
      targets: "${{ inputs.os }}"
      node-version: "${{ inputs.node-version }}"
      bytecode: 'false'
  - name: Run harness tests Windows
    if: ${{ inputs.os == 'windows' }}
    run: yarn test.harness
    shell: pwsh
    env:
      NODE_OPTIONS: --no-deprecation
