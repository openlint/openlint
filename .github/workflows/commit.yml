name: Commit
on:
  workflow_call:
  pull_request:
    branches: [main]
    paths-ignore:
    - README.md
    - .github/**
jobs:
  read-node-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.node.outputs.version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 1
    - name: Read Node.js version
      id: node
      run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
  test-node:
    needs: read-node-version
    runs-on: ubuntu-latest
    container:
      image: node:${{ matrix.node-version }}
      options: --user root
    strategy:
      matrix:
        node-version:
        - '22.23.3'
        - "${{ needs.read-node-version.outputs.version }}"
        - '26.11.1'
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 2
    - name: Mark repo as safe for Git
      run: git config --global --add safe.directory /__w/openlint/openlint
    - name: Cached dependencies
      uses: "./.github/actions/cached-dependencies"
    - name: Build
      run: yarn build
      shell: bash
    - name: Test node
      run: yarn pretest
      shell: bash
    - name: Run node tests
      run: yarn test.jest --ci --maxWorkers=3
      shell: bash
    - name: Test harness
      if: matrix.node-version == '22.23.3'
      uses: "./.github/actions/test-harness-linux"
      with:
        os: "linux"
        node-version: "${{ matrix.node-version }}"
  test-windows:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        # The test-harness cache key is derived from HEAD~1, which a depth-1 clone lacks.
        fetch-depth: 2
    - name: Set up Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .nvmrc
    - name: Cached dependencies
      uses: "./.github/actions/cached-dependencies"
      with:
        install-corepack: true
    - name: Build
      run: yarn build
    - name: Test node
      run: yarn pretest
    - name: Run node tests
      run: yarn test.jest --ci --maxWorkers=3
    - name: Test harness
      uses: "./.github/actions/test-harness-windows"
      with:
        os: "windows"
        node-version: "22.23.3"
  test-browser:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
    - name: Set up Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .nvmrc
    - name: Cached dependencies
      uses: "./.github/actions/cached-dependencies"
    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v1.2.0
    - name: Install chrome dependencies
      run: yarn add -D karma-chrome-launcher
    - name: Build
      run: yarn build
      shell: bash
    - run: yarn pretest
    - name: Run browser tests
      run: yarn test.karma
      env:
        CI: true
  lint:
    needs: read-node-version
    runs-on: ubuntu-latest
    container:
      image: node:${{ needs.read-node-version.outputs.version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
    - name: Cached dependencies
      uses: "./.github/actions/cached-dependencies"
      with:
        install-corepack: true
    - name: Build
      run: yarn build
      shell: bash
    - name: Lint commit message
      run: node ./scripts/lint-commit-messages.mjs
    - name: Lint code
      run: |-
        yarn prelint
        yarn lint.eslint
    - name: Lint documentation
      run: yarn lint.prettier

  jsonschema-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - uses: sourcemeta/jsonschema@v7.0.2
    - run: jsonschema metaschema --verbose packages/core/src/ruleset/meta/*.json
    - run: jsonschema lint --verbose packages/core/src/ruleset/meta/*.json

    # As a smoke test to ensure the schemas at least reference each other well
    - run: >
        jsonschema bundle --verbose
        packages/core/src/ruleset/meta/ruleset.schema.json
        --resolve packages/core/src/ruleset/meta
        --ignore packages/core/src/ruleset/meta/js-extensions.json
