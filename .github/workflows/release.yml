name: Release
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run release in dry-run mode (no publishing)'
        required: false
        default: false
        type: boolean

jobs:
  # Call the commit workflow to run all tests and linting
  run-tests:
    uses: ./.github/workflows/commit.yml

  read-node-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.node.outputs.version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 1
    - name: Read Node.js version
      id: node
      run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

  release:
    runs-on: ubuntu-latest
    container:
      image: node:${{ needs.read-node-version.outputs.version }}
    needs:
    - run-tests
    - read-node-version
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        token: ${{ secrets.GH_TOKEN }}
    - name: Configure Git
      run: |
        git config --global --add safe.directory /__w/openlint/openlint
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
    - name: Cached dependencies
      uses: "./.github/actions/cached-dependencies"
    - name: Set up NPM auth
      run: echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> .npmrc
      env:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    - name: Build
      run: yarn build
    - name: Release
      run: yarn release
      env:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
